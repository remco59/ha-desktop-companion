name: Windows CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/DesktopCompanion.sln

      - name: Build
        run: dotnet build src/DesktopCompanion.sln --configuration Release --no-restore

      - name: Run dashboard logic tests
        run: dotnet test src/DesktopCompanion.Tests/DesktopCompanion.Tests.csproj --configuration Release --no-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Home Assistant integration syntax
        run: python -m compileall -q integrations/homeassistant/custom_components/desktop_companion
