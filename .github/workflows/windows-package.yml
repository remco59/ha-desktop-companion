name: Windows Package

on:
  push:
    branches: ["feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Publish and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/DesktopCompanion.sln

      - name: Publish self-contained WinUI app
        run: dotnet publish src/DesktopCompanion.App/DesktopCompanion.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -o artifacts/publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler" }
          & $compiler /DAppVersion=0.1.0-preview "installer/DesktopCompanion.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Companion-Windows-x64
          path: artifacts/Desktop-Companion-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
